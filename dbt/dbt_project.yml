name: 'fossil_dependence'
version: '1.0.0'
config-version: 2

profile: 'fossil_dependence_dbt'

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  fossil_dependence:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  fossil_dependence:
    energy_sources:
      +schema: marts
      +column_types:
        source: varchar(50)
        category: varchar(10)