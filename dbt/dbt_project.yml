name: 'fossil_dependence'
version: '1.0.0'
config-version: 2

profile: 'fossil_dependence_dbt'

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  fossil_dependence:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  fossil_dependence:
    +schema: reference
    country_codes:
      +alias: ref_country_codes
    energy_sources:
      +alias: ref_energy_sources