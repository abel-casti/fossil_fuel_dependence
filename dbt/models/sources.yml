version: 2

sources:
  - name: staging_tables
    description: Tables injected into postgres by python extractor.
    database: fossil_dependence
    schema: staging
    tables:
    - name: generation_log
      description: Raw generation by type data. 15-min granularity.
    - name: load_log
      description: Raw load data. 15-min granularity.
      columns:
        - name: timestamp
          description: Timestamp in Europe/Madrid timezone. One value every 15 minutes.
        - name: actual_load
          description: Load measured in Megawatts (MW) for a 15 minutes period.
        - name: country_code
          description: Short code for country.