fossil_dependence_dbt:
  target: prd
  outputs:
    prd:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      port: 5432
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: trfm
      keepalives_idle: 0  
      connect_timeout: 10
      retries: 1